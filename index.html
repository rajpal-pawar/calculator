<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calci</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <div class="display">
            <p id="expression"></p>
            <p id="ans"></p>
        </div>
        <div class="numpad">

            <div class="bttns">
                <!-- top row -->

                <button onclick="clearr()" class="clear">C</button>
                <button class="back" onclick="bckspc()">⌫</button>
                <button onclick="square()"  class="oprt">^2</button>
                <button onclick="oprtr('%')"  class="oprt">%</button>

                <button onclick="addNum('7')">7</button>
                <button onclick="addNum('8')">8</button>
                <button onclick="addNum('9')">9</button>
                <button onclick="oprtr('/')"  class="oprt">÷</button>

                <button onclick="addNum('4')">4</button>
                <button onclick="addNum('5')">5</button>
                <button onclick="addNum('6')">6</button>
                <button onclick="oprtr('*')" class="oprt">&#xD7</button>

                <button onclick="addNum('1')">1</button>
                <button onclick="addNum('2')">2</button>
                <button onclick="addNum('3')">3</button>
                <button onclick="oprtr('-')" class="oprt">-</button>

                <button onclick="addNum('0')">0</button>
                <button onclick="addNum('.')">.</button>
                <button  onclick="show()">=</button>
                <button onclick="oprtr('+')" class="oprt">+</button>
            </div>

        </div>
    </div>
    <script src="logic.js"></script>
</body>

</html>
