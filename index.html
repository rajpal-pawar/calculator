<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        /* reveal a meme when hovered over a button */
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;

        }

        html {
            padding: 0;
            margin: 0;

        }

        body {

            background-color: rgb(110, 187, 187);
            min-height: 100vh;
            display: grid;
            place-items: center;

        }

        .box {
            border: hidden;
            user-select: none;
            border-radius: 25px;


            padding: 15px;
            background-color: rgb(54, 48, 48);

        }

        .display {
            min-height: 200px;
            border-radius: 15px;
            background-color: rgb(69, 71, 73);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            flex-direction: column;
            padding: 15px;
        }

        p {
            font-size: xx-large;
            color: white;
        }

        #expression {
            color: whitesmoke;
            font-size: x-large;
        }



        .bttns {
            margin-top: 3vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
        }

        button {
            min-height: 60px;
            min-width: 65px;
            border: none;
            border-radius: 10px;
            background-color: rgb(107, 189, 192);
            font-size: x-large;
            font-weight: bold;
        }
        button:hover{
            opacity: 0.9;
        }
        button:active{
            opacity: 0.8;
            transform: scale(0.9);
        }

        .oprt {
            background-color: rgb(233, 76, 76);
        }

        #result {
            background-color: goldenrod;
        }

        #back {
            background-color: burlywood;
        }

        #clear {
            background-color: burlywood;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="display">
            <p id="expression"></p>
            <p id="ans"></p>
        </div>
        <div class="numpad">

            <div class="bttns">
                <!-- top row -->

                <button onclick="clearr()" id="clear">C</button>
                <button onclick="bckspc()" id="back">⌫</button>
                <button onclick="square()"  class="oprt">^2</button>
                <button onclick="oprtr('%')"  class="oprt">%</button>

                <button onclick="addNum('7')">7</button>
                <button onclick="addNum('8')">8</button>
                <button onclick="addNum('9')">9</button>
                <button onclick="oprtr('/')"  class="oprt">÷</button>

                <button onclick="addNum('4')">4</button>
                <button onclick="addNum('5')">5</button>
                <button onclick="addNum('6')">6</button>
                <button onclick="oprtr('*')" class="oprt">&#xD7</button>

                <button onclick="addNum('1')">1</button>
                <button onclick="addNum('2')">2</button>
                <button onclick="addNum('3')">3</button>
                <button onclick="oprtr('-')" class="oprt">-</button>

                <button onclick="addNum('0')">0</button>
                <button onclick="addNum('.')">.</button>
                <button  onclick="show()">=</button>
                <button onclick="oprtr('+')" class="oprt">+</button>
            </div>

        </div>
    </div>
    <script src="logic.js"></script>
</body>

</html>
